name: Verify Frame Home

on:
  pull_request:
  push:
    branches: [develop]
  workflow_call:
    inputs:
      ref:
        description: Exact commit to verify and package
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libudev-dev libusb-1.0-0-dev
      - run: npm run setup:ci
      - name: Test release validation
        run: node --test test/scripts/release.test.mjs
      - run: npm run compile
      - run: npm run test:unit
      - run: npm run bundle
      - name: Package Frame Home for Linux x64
        run: npx electron-builder --linux tar.gz --x64 --publish never --config=build/electron-builder-home.js
      - name: Record archive checksum
        working-directory: dist/home
        run: sha256sum ./*.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frame-home-linux-x64
          path: |
            dist/home/*.tar.gz
            dist/home/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
