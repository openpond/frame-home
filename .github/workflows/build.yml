name: Draft Frame Home release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag on develop (for example v0.6.12-home.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-22.04
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - id: tag
        name: Require a versioned commit already merged into develop
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/validate-release.mjs

  verify:
    needs: validate
    uses: ./.github/workflows/compile-and-test.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}

  draft:
    name: Create draft with verified archive
    needs: [validate, verify]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frame-home-linux-x64
          path: artifacts
      - name: Verify and attach artifacts
        working-directory: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          sha256sum --check SHA256SUMS
          printf 'Frame Home Linux x64 archive built from commit %s.\n\nReview and smoke-test this draft before publishing. macOS and Windows installers are not included.\n' "$RELEASE_SHA" > release-notes.md
          release_flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then release_flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" ./*.tar.gz SHA256SUMS --draft --verify-tag --title "Frame Home $RELEASE_TAG" --notes-file release-notes.md "${release_flags[@]}"
